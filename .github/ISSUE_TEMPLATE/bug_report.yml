name: "🐛 Bug Report"
description: Report a defect, crash, or broken behavior in the AURA framework
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve AURA! Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: AURA Version / Commit
      description: What version of AURA are you running? (Run `python core/cli/main.py doctor` or `git rev-parse --short HEAD`)
      placeholder: "e.g., v1.0.0 or commit d05e9b7"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating System & Agent Environment
      description: What environment are you running AURA in?
      options:
        - "Google Antigravity (Windows)"
        - "Google Antigravity (macOS)"
        - "Google Antigravity (Linux)"
        - "Claude Code CLI"
        - "Cursor IDE"
        - "Android Studio Gemini"
        - "Standalone Python CLI"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      value: |
        1. Run command '...'
        2. Ingest chat '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Doctor Logs
      description: Paste relevant logs from `python core/cli/main.py doctor` or crash tracebacks.
      render: shell
