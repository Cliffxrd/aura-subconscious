name: Aura Architecture CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Nightly build

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
        
    - name: Install Playwright Browsers
      run: playwright install chromium

    - name: Check code formatting (Black)
      run: |
        black --check core/ config/

    - name: Lint with Flake8
      run: |
        flake8 core/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 core/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Type checking (MyPy)
      run: |
        mypy core/ --ignore-missing-imports

    - name: Run tests with Pytest
      run: |
        python -m unittest discover -s tests
        python core/cli/main.py doctor
        pytest --cov=core tests/ --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
